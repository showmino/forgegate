name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Also on pull requests from this repo, so a preview environment can run the branch.
  image:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    needs: test
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    env:
      # Forge looks for the tag of the branch's commit, not of the PR's merge commit.
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          image=ghcr.io/showmino/forgegate:${SHA::7}
          docker build -t "$image" .
          docker push "$image"

  # Deploys main to staging through Forge. Runs on the LAN runners, which can
  # reach the Forge API, and logs in with this job's GitHub OIDC token: the
  # token only lets it deploy this service to staging, at this commit.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: image
    runs-on: self-hosted
    timeout-minutes: 20
    concurrency:
      group: forge-deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      FORGE_API_URL: ${{ vars.FORGE_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Get the forge CLI from the Forge API
        run: |
          if [ -z "$FORGE_API_URL" ]; then
            echo "::error::set the organization variable FORGE_API_URL to the Forge API (for example http://forge.10.150.1.221.nip.io)"
            exit 1
          fi
          case $(uname -m) in
            x86_64) arch=amd64 ;;
            aarch64|arm64) arch=arm64 ;;
            *) echo "::error::unsupported runner architecture $(uname -m)"; exit 1 ;;
          esac
          url="$FORGE_API_URL/cli/forge-linux-$arch"
          echo "downloading $url"
          curl -fsS --retry 3 --max-time 120 -o "$RUNNER_TEMP/forge" "$url"
          chmod +x "$RUNNER_TEMP/forge"
          "$RUNNER_TEMP/forge" version
      - name: Deploy to staging
        run: '"$RUNNER_TEMP/forge" deploy start --env staging'
