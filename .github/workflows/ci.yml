name: ci
on:
  pull_request:

permissions:
  contents: read

# The repo is public, so its jobs run on GitHub's runners: the self-hosted
# runners do not take jobs from public repos.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Fails on a broken link or anchor (docusaurus.config.ts).
      - run: npm run build

  image:
    needs: test
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write
