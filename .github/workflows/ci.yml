name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The repo is public, so its jobs run on GitHub's runners: the self-hosted
# runners do not take jobs from public repos.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Fails on a broken link or anchor (docusaurus.config.ts).
      - run: npm run build

  # Also on pull requests from this repo, so a preview environment can run the branch.
  image:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Forge looks for the tag of the branch's commit, not of the PR's merge commit.
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # forgegate.io/charts: the forge chart's packages from showmino/forge's
      # releases, indexed (scripts/charts.sh). New versions arrive with the
      # next build, such as the version bump after a forge release.
      - uses: azure/setup-helm@v4
        with:
          version: v3.21.4
      - name: Collect the chart repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh scripts/charts.sh
      - name: Build and push
        run: |
          image=ghcr.io/showmino/forgegate:${SHA::7}
          docker build -t "$image" .
          docker push "$image"

  # Deploys main to staging through Forge's public API address, and logs in
  # with this job's GitHub OIDC token: the token only lets it deploy this
  # service to staging, at this commit.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: forge-deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      FORGE_API_URL: https://forge-api.showmino.com
    steps:
      - uses: actions/checkout@v4
      - name: Get the forge CLI from the Forge API
        run: |
          case $(uname -m) in
            x86_64) arch=amd64 ;;
            aarch64|arm64) arch=arm64 ;;
            *) echo "::error::unsupported runner architecture $(uname -m)"; exit 1 ;;
          esac
          url="$FORGE_API_URL/cli/forge-linux-$arch"
          echo "downloading $url"
          curl -fsS --retry 3 --max-time 120 -o "$RUNNER_TEMP/forge" "$url"
          chmod +x "$RUNNER_TEMP/forge"
          "$RUNNER_TEMP/forge" version
      - name: Deploy to staging
        run: '"$RUNNER_TEMP/forge" deploy start --env staging'
