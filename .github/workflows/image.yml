name: image

on:
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      # Forge expects the branch commit, not the PR's synthetic merge commit.
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: docker/login-action@v3
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: azure/setup-helm@v4
        with:
          version: v3.21.4
      - name: Collect the chart repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh scripts/charts.sh
      - name: Build
        run: docker build -t "ghcr.io/showmino/forgegate:${SHA::7}" .
      - name: Push
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          image=ghcr.io/showmino/forgegate:${SHA::7}
          docker push "$image"
