# Forge service manifest. See 'forge init --help'.
apiVersion: forge.dev/v1
service:
  name: forgegate
  team: platform-engineering
  lifecycle: experimental
  repo: https://github.com/showmino/forgegate
run:
  port: 3000
  health: /api/healthz
  autoscaling:
    max: 5
  domain: forgegate.io
  staging:
    public: false
resources:
  - name: main
    type: postgres
    storage: 5Gi              # whole Gi, at least 1Gi (default 1Gi)
    environments:             # optional overrides per environment
      production:
        storage: 20Gi
        instances: 2
      staging:
        storage: 10Gi
        instances: 1