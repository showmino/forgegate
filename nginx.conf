# Serves the Docusaurus build on port 3000. Everything nginx writes is under
# /tmp, the only writable directory in a Forge pod.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  sendfile on;
  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  server {
    listen 3000;
    root /usr/share/nginx/html;
    # Redirects keep the host and scheme the browser used, not nginx's own.
    absolute_redirect off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Forge's readiness and liveness probe: a static file.
    location = /api/healthz {
      default_type text/plain;
      access_log off;
    }

    # Docusaurus fingerprints these file names, so they never change.
    location /assets/ {
      expires 1y;
    }

    # trailingSlash: false builds /docs/foo as docs/foo.html, so /docs/foo/
    # redirects to /docs/foo.
    rewrite ^/(.+)/$ /$1 permanent;

    location / {
      try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
  }
}
